<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi's Haunted Mansion</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
    color:white;
}

/* ================= GAME ================= */

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* ================= ROOM ================= */

#room{

    position:absolute;
    inset:0;

    background-size:cover;
    background-position:center;

    transition:
    opacity 0.6s,
    transform 0.6s;

    animation:flicker 5s infinite;

}

/* ROOM TRANSITION */

.roomFadeOut{

    opacity:0;
    transform:scale(1.05);

}

.roomFadeIn{

    opacity:1;
    transform:scale(1);

}

/* ================= LIGHT FLICKER ================= */

@keyframes flicker{

    0%{ filter:brightness(1); }
    5%{ filter:brightness(0.7); }
    7%{ filter:brightness(1.1); }
    10%{ filter:brightness(0.6); }
    11%{ filter:brightness(1); }
    55%{ filter:brightness(1); }
    56%{ filter:brightness(0.5); }
    58%{ filter:brightness(1); }
    100%{ filter:brightness(1); }

}

/* ================= GHOSTS ================= */

.ghost{

    position:absolute;
    opacity:0.7;
    pointer-events:none;
    animation:ghostFloat 6s ease-in-out infinite;

}

@keyframes ghostFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-20px)
        translateX(10px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* ================= DOG ================= */

#dog{

    position:absolute;

    width:120px;

    bottom:170px;
    left:120px;

    z-index:10;

    transition:0.5s;

}

/* ================= HOTSPOTS ================= */

.hotspot{

    position:absolute;

    border:2px dashed rgba(255,255,255,0.15);

    cursor:pointer;

    transition:0.2s;

}

.hotspot:hover{

    background:rgba(255,255,255,0.2);

    border:2px solid rgba(255,255,255,0.7);

}

/* ================= TOOLTIP ================= */

#tooltip{

    position:absolute;

    display:none;

    padding:10px 12px;

    background:rgba(0,0,0,0.85);

    border:2px solid #c084fc;

    border-radius:12px;

    color:#f5d0fe;

    z-index:50;

    pointer-events:none;

    font-size:15px;

    font-weight:bold;

}

/* ================= UI ================= */

#ui{

    position:absolute;

    bottom:0;

    width:100%;

    background:rgba(0,0,0,0.86);

    border-top:3px solid #b983ff;

    padding:18px;

    box-sizing:border-box;

    z-index:20;

}

#topBar{

    display:flex;

    gap:20px;

    flex-wrap:wrap;

    color:#f5d0fe;

    margin-bottom:10px;

    font-size:18px;

}

#text{

    min-height:70px;

    line-height:1.6;

    font-size:18px;

}

/* ================= CONTINUE ================= */

#continue{

    margin-top:10px;

    color:#c084fc;

    animation:blink 1s infinite;

    font-size:14px;

}

@keyframes blink{

    0%{ opacity:0; }

    50%{ opacity:1; }

    100%{ opacity:0; }

}

/* ================= BUTTON ================= */

button{

    background:#a855f7;

    border:none;

    color:white;

    padding:12px 18px;

    border-radius:12px;

    margin-top:10px;

    cursor:pointer;

    font-size:16px;

    transition:0.2s;

}

button:hover{

    background:#c084fc;

    transform:scale(1.05);

}

/* ================= CUTSCENE ================= */

#cutscene{

    position:absolute;

    inset:0;

    background:rgba(0,0,0,0.95);

    z-index:100;

    display:none;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:50px;

    box-sizing:border-box;

}

#cutsceneText{

    max-width:900px;

    line-height:1.8;

    font-size:30px;

    color:#fde68a;

}

</style>
</head>

<body>

<div id="game">

    <!-- ROOM -->

    <div id="room"></div>

    <!-- GHOSTS -->

    <img class="ghost"
    src="https://cdn-icons-png.flaticon.com/512/3094/3094835.png"
    style="width:100px; top:10%; left:5%;">

    <img class="ghost"
    src="https://cdn-icons-png.flaticon.com/512/3094/3094835.png"
    style="width:80px; top:25%; right:8%; animation-duration:8s;">

    <img class="ghost"
    src="https://cdn-icons-png.flaticon.com/512/3094/3094835.png"
    style="width:90px; bottom:35%; left:70%; animation-duration:10s;">

    <!-- DOG -->

    <img id="dog"
    src="https://cdn-icons-png.flaticon.com/512/616/616408.png">

    <!-- TOOLTIP -->

    <div id="tooltip"></div>

    <!-- UI -->

    <div id="ui">

        <div id="topBar">

            <div id="day"></div>
            <div id="energy"></div>
            <div id="inventory"></div>
            <div id="location"></div>

        </div>

        <div id="text"></div>

        <div id="continue">
        press SPACE or ENTER to continue
        </div>

        <div id="buttons"></div>

    </div>

    <!-- CUTSCENE -->

    <div id="cutscene">

        <div id="cutsceneText"></div>

    </div>

</div>

<script>

/* ================= GAME STATE ================= */

let day = 1;

let energy = 3;

let inventory = [];

let currentRoom = "foyer";

let secret = [];

let dialogueQueue = [];

let dialogueActive = false;

/* ================= ELEMENTS ================= */

const roomEl = document.getElementById("room");

const dog = document.getElementById("dog");

const tooltip = document.getElementById("tooltip");

const textEl = document.getElementById("text");

const cutscene = document.getElementById("cutscene");

const cutsceneText = document.getElementById("cutsceneText");

/* ================= DIALOGUE SYSTEM ================= */

function startDialogue(lines){

    dialogueQueue = lines;

    dialogueActive = true;

    nextDialogue();

}

function nextDialogue(){

    if(dialogueQueue.length <= 0){

        dialogueActive = false;

        return;

    }

    textEl.innerHTML = dialogueQueue.shift();

}

/* ENTER / SPACE */

document.addEventListener("keydown",(e)=>{

    if(
        e.code === "Space" ||
        e.code === "Enter"
    ){

        if(dialogueActive){

            nextDialogue();

        }

    }

});

/* ================= ROOMS ================= */

const rooms = {

    foyer:{

        name:"Foyer",

        bg:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop",

        text:[
            "Mochi stands in the haunted foyer.",
            "The chandelier flickers ominously."
        ],

        hotspots:[

            {
                x:"8%",
                y:"40%",
                w:"18%",
                h:"35%",
                label:"🍲 Go Kitchen",
                type:"move",
                action:()=>moveRoom("kitchen",100)
            },

            {
                x:"72%",
                y:"22%",
                w:"20%",
                h:"48%",
                label:"🪜 Go Upstairs",
                type:"move",
                action:()=>moveRoom("upstairs",650)
            },

            {
                x:"42%",
                y:"18%",
                w:"15%",
                h:"35%",
                label:"🖼 Bark Portrait (-1)",
                type:"action",
                action:()=>{

                    addSecret("bark");

                    doAction([
                        "Mochi barks at the portrait.",
                        "The portrait looks deeply offended.",
                        "'wow okay rude.'"
                    ]);

                }
            }

        ]

    },

    kitchen:{

        name:"Kitchen",

        bg:"https://images.unsplash.com/photo-1484154218962-a197022b5858?q=80&w=1200&auto=format&fit=crop",

        text:[
            "Floating soup pots drift through the kitchen.",
            "Something inside the fridge is breathing."
        ],

        hotspots:[

            /* ONLY DAY 1 */

            ...(day === 1 ? [

                {

                    x:"70%",
                    y:"28%",
                    w:"18%",
                    h:"38%",
                    label:"🦴 Open Cabinet (-1)",
                    type:"action",

                    action:()=>{

                        if(!inventory.includes("Ghost Bone")){

                            inventory.push("Ghost Bone");

                        }

                        doAction([
                            "Mochi opens the cabinet.",
                            "Behind haunted soup cans...",
                            "A glowing Ghost Bone appears."
                        ]);

                    }

                }

            ] : []),

            {
                x:"5%",
                y:"40%",
                w:"15%",
                h:"30%",
                label:"⬅ Return Foyer",
                type:"move",
                action:()=>moveRoom("foyer",120)
            }

        ]

    },

    upstairs:{

        name:"Upstairs Hall",

        bg:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop",

        text:[
            "A ghost vacuum cleaner patrols aggressively."
        ],

        hotspots:[

            {
                x:"74%",
                y:"28%",
                w:"15%",
                h:"42%",
                label:"📚 Library",
                type:"move",
                action:()=>moveRoom("library",680)
            },

            {
                x:"10%",
                y:"40%",
                w:"15%",
                h:"35%",
                label:"⬇ Downstairs",
                type:"move",
                action:()=>moveRoom("foyer",120)
            }

        ]

    },

    library:{

        name:"Library",

        bg:"https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1200&auto=format&fit=crop",

        text:[
            "Books float through the air like angry pigeons."
        ],

        hotspots:[

            /* ONLY DAY 2 */

            ...(day === 2 ? [

                {

                    x:"65%",
                    y:"20%",
                    w:"18%",
                    h:"55%",
                    label:"🔑 Inspect Shelf (-1)",
                    type:"action",

                    action:()=>{

                        if(!inventory.includes("Rusty Key")){

                            inventory.push("Rusty Key");

                        }

                        doAction([
                            "A dictionary falls on Mochi's head.",
                            "Behind the shelf...",
                            "A Rusty Key glows ominously."
                        ]);

                    }

                }

            ] : []),

            {
                x:"35%",
                y:"50%",
                w:"18%",
                h:"15%",
                label:"💨 Do Zoomies (-1)",
                type:"action",

                action:()=>{

                    addSecret("zoomies");

                    doAction([
                        "Mochi performs incredible zoomies.",
                        "The ghosts clap politely."
                    ]);

                }
            },

            {
                x:"84%",
                y:"40%",
                w:"10%",
                h:"25%",
                label:"🚪 Basement",
                type:"move",
                action:()=>moveRoom("basement",720)
            },

            {
                x:"10%",
                y:"40%",
                w:"15%",
                h:"30%",
                label:"⬅ Upstairs",
                type:"move",
                action:()=>moveRoom("upstairs",100)
            }

        ]

    },

    basement:{

        name:"Basement",

        bg:"https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1200&auto=format&fit=crop",

        text:[
            "The basement is freezing cold.",
            "The shadows twitch along the walls."
        ],

        hotspots:[

            /* ONLY DAY 3 */

            ...(day === 3 ? [

                {

                    x:"45%",
                    y:"28%",
                    w:"12%",
                    h:"30%",
                    label:"🕯 Take Candle (-1)",
                    type:"action",

                    action:()=>{

                        if(!inventory.includes("Haunted Candle")){

                            inventory.push("Haunted Candle");

                        }

                        doAction([
                            "Mochi grabs the Haunted Candle.",
                            "The entire mansion groans loudly."
                        ]);

                    }

                }

            ] : []),

            {
                x:"18%",
                y:"60%",
                w:"18%",
                h:"16%",
                label:"🐾 Dig Floorboards (-1)",
                type:"action",

                action:()=>{

                    addSecret("dig");

                    doAction([
                        "Mochi digs through the floorboards.",
                        "Ancient dog treats from 1881 appear."
                    ]);

                }
            },

            {
                x:"5%",
                y:"40%",
                w:"15%",
                h:"30%",
                label:"⬅ Return Library",
                type:"move",
                action:()=>moveRoom("library",100)
            }

        ]

    }

};

/* ================= UPDATE UI ================= */

function updateUI(){

    document.getElementById("day").innerHTML =
    `🌙 Day ${day}/3`;

    document.getElementById("energy").innerHTML =
    `⚡ Energy: ${energy}`;

    document.getElementById("inventory").innerHTML =
    `🧸 ${inventory.join(", ") || "No Items"}`;

    document.getElementById("location").innerHTML =
    `📍 ${rooms[currentRoom].name}`;

}

/* ================= ENERGY ================= */

function spendEnergy(){

    if(energy <= 0) return false;

    energy--;

    if(energy <= 0){

        energy = 0;

        lockDay();

    }

    updateUI();

    return true;

}

/* ================= ACTION ================= */

function doAction(lines){

    if(energy <= 0) return;

    spendEnergy();

    startDialogue(lines);

}

/* ================= LOCK DAY ================= */

function lockDay(){

    clearHotspots();

    textEl.innerHTML =
    "Mochi is too eepy to continue exploring today.";

    const btn = document.createElement("button");

    btn.innerHTML =
    "💤 Sleep Until Next Day";

    btn.onclick = nextDay;

    document.getElementById("buttons").innerHTML = "";

    document.getElementById("buttons").appendChild(btn);

}

/* ================= MOVE ROOM ================= */

function moveRoom(room,x){

    currentRoom = room;

    dog.style.left = x + "px";

    roomEl.classList.add("roomFadeOut");

    setTimeout(()=>{

        loadRoom();

        roomEl.classList.remove("roomFadeOut");

        roomEl.classList.add("roomFadeIn");

    },300);

}

/* ================= HOTSPOTS ================= */

function clearHotspots(){

    document.querySelectorAll(".hotspot")
    .forEach(h=>h.remove());

}

/* ================= LOAD ROOM ================= */

function loadRoom(){

    updateUI();

    clearHotspots();

    roomEl.style.backgroundImage =
    `linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.6)), url('${rooms[currentRoom].bg}')`;

    startDialogue(rooms[currentRoom].text);

    rooms[currentRoom].hotspots.forEach(h=>{

        const div = document.createElement("div");

        div.className = "hotspot";

        div.style.left = h.x;
        div.style.top = h.y;
        div.style.width = h.w;
        div.style.height = h.h;

        div.onmouseenter = (e)=>{

            tooltip.style.display = "block";

            tooltip.innerHTML =
            `${h.label}<br><span style='font-size:12px;color:#ddd;'>click to interact</span>`;

        };

        div.onmousemove = (e)=>{

            tooltip.style.left =
            e.pageX + 12 + "px";

            tooltip.style.top =
            e.pageY + 12 + "px";

        };

        div.onmouseleave = ()=>{

            tooltip.style.display = "none";

        };

        div.onclick = h.action;

        roomEl.appendChild(div);

    });

}

/* ================= NEXT DAY ================= */

function nextDay(){

    day++;

    energy = 3;

    document.getElementById("buttons").innerHTML = "";

    if(day > 3){

        ending();

        return;

    }

    loadRoom();

}

/* ================= SECRET ================= */

function addSecret(word){

    secret.push(word);

    if(secret.length > 3){

        secret.shift();

    }

    if(
        secret[0] === "bark" &&
        secret[1] === "zoomies" &&
        secret[2] === "dig"
    ){

        secretEnding();

    }

}

/* ================= ENDINGS ================= */

function ending(){

    cutscene.style.display = "flex";

    if(inventory.length === 3){

        playCutscene([

            "⭐ TRUE ENDING ⭐",

            "Mochi collected all three relics.",

            "The curse shatters apart.",

            "The mansion screams as sunlight floods the halls.",

            "Mochi escapes into freedom carrying the haunted candle proudly in his mouth."

        ]);

    }

    else{

        playCutscene([

            "👑 BAD ENDING 👑",

            "Mochi failed to gather every relic.",

            "The ghosts crown him the new ruler of the mansion forever.",

            "THE DREAD LORD OF BARKNESS",

            "honestly he seems pretty happy about it"

        ]);

    }

}

/* ================= SECRET ENDING ================= */

function secretEnding(){

    cutscene.style.display = "flex";

    playCutscene([

        "💥 SECRET ENDING 💥",

        "The forbidden sequence is complete.",

        "Reality begins buffering.",

        "Mochi slowly turns toward YOU.",

        "'wait... im trapped inside html?'",

        "The universe collapses into corrupted png files and squeaky toy noises.",

        "EVERYTHING EXPLODES."

    ]);

}

/* ================= CUTSCENE ================= */

function playCutscene(lines){

    let index = 0;

    cutsceneText.innerHTML =
    lines[index];

    function next(e){

        if(
            e.code === "Space" ||
            e.code === "Enter"
        ){

            index++;

            if(index >= lines.length){

                location.reload();

                return;

            }

            cutsceneText.innerHTML =
            lines[index];

        }

    }

    document.addEventListener("keydown",next);

}

/* ================= START ================= */

loadRoom();

</script>

</body>
</html>
