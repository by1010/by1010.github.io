<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi's Haunted Mansion</title>

<style>

body{

    margin:0;
    background:#050505;
    overflow:hidden;
    font-family:"Courier New", monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;

}

/* ================= GAME BORDER ================= */

#gameBorder{

    width:1280px;
    height:720px;
    border:6px solid #8b5cf6;
    position:relative;
    transition:0.3s;
    box-shadow:0 0 30px #6d28d9;
    background:black;

}

#gameBorder:hover{

    border-color:#f472b6;
    box-shadow:0 0 40px #f472b6;

}

/* ================= GAME ================= */

#game{

    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    image-rendering:pixelated;

}

/* ================= ROOM ================= */

#room{

    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    transition:1s;
    animation:flicker 5s infinite;
    filter:contrast(1.1) saturate(0.7);

}

/* ================= ROOM TRANSITION ================= */

#fade{

    position:absolute;
    inset:0;
    background:black;
    opacity:0;
    pointer-events:none;
    transition:0.6s;
    z-index:90;

}

/* ================= RETRO FILTER ================= */

#scanlines{

    position:absolute;
    inset:0;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 4px
    );

    pointer-events:none;
    z-index:80;

}

/* ================= FLICKER ================= */

@keyframes flicker{

    0%{filter:brightness(1);}
    3%{filter:brightness(0.7);}
    6%{filter:brightness(1);}
    40%{filter:brightness(1);}
    41%{filter:brightness(0.6);}
    43%{filter:brightness(1);}
    100%{filter:brightness(1);}

}

/* ================= GHOSTS ================= */

.ghost{

    position:absolute;
    width:100px;
    opacity:0.65;
    animation:floatGhost 6s ease-in-out infinite;
    pointer-events:none;

}

@keyframes floatGhost{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-25px) translateX(10px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* ================= DOG ================= */

#dog{

    position:absolute;
    width:120px;
    bottom:150px;
    left:120px;
    z-index:10;
    transition:0.7s;

}

/* ================= HOTSPOTS ================= */

.hotspot{

    position:absolute;
    border:2px dashed rgba(255,255,255,0.15);
    transition:0.2s;
    cursor:pointer;

}

.hotspot:hover{

    background:rgba(255,255,255,0.2);
    border-color:#f472b6;

}

/* ================= TOOLTIP ================= */

#tooltip{

    position:absolute;
    display:none;
    background:rgba(0,0,0,0.9);
    border:2px solid #f472b6;
    padding:10px;
    z-index:100;
    pointer-events:none;
    font-size:14px;

}

/* ================= UI ================= */

#ui{

    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.88);
    border-top:3px solid #8b5cf6;
    padding:16px;
    box-sizing:border-box;
    z-index:50;

}

#topBar{

    display:flex;
    gap:20px;
    margin-bottom:12px;
    flex-wrap:wrap;
    color:#f5d0fe;

}

#text{

    min-height:80px;
    line-height:1.6;
    font-size:18px;

}

button{

    background:#7c3aed;
    border:none;
    color:white;
    padding:10px 16px;
    margin-top:12px;
    cursor:pointer;
    font-family:inherit;
    transition:0.2s;

}

button:hover{

    background:#f472b6;

}

/* ================= ENDING SCREEN ================= */

#endingScreen{

    position:absolute;
    inset:0;
    background:black;
    z-index:200;
    display:none;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
    box-sizing:border-box;

}

#endingText{

    max-width:800px;
    line-height:1.8;
    font-size:24px;
    color:#fde68a;

}

</style>
</head>

<body>

<div id="gameBorder">

<div id="game">

<div id="room"></div>

<div id="fade"></div>

<div id="scanlines"></div>

<!-- GHOSTS -->

<img class="ghost"
src="https://cdn-icons-png.flaticon.com/512/3094/3094835.png"
style="top:10%;left:8%;">

<img class="ghost"
src="https://cdn-icons-png.flaticon.com/512/3094/3094835.png"
style="top:20%;right:8%;animation-duration:9s;">

<!-- DOG -->

<img id="dog"
src="https://cdn-icons-png.flaticon.com/512/616/616408.png">

<!-- TOOLTIP -->

<div id="tooltip"></div>

<!-- UI -->

<div id="ui">

<div id="topBar">

<div id="day"></div>

<div id="energy"></div>

<div id="inventory"></div>

<div id="location"></div>

</div>

<div id="text"></div>

<div id="buttons"></div>

</div>

<!-- ENDING -->

<div id="endingScreen">

<div>

<div id="endingText"></div>

<button id="nextEndingBtn">
continue
</button>

</div>

</div>

</div>

</div>

<script>

/* ================= STATE ================= */

let day = 1;

let energy = 3;

let inventory = [];

let currentRoom = "foyer";

let secret = [];

let outsideClicks = 0;

let foundItemToday = false;

/* ================= ELEMENTS ================= */

const roomEl = document.getElementById("room");

const tooltip = document.getElementById("tooltip");

const dog = document.getElementById("dog");

const fade = document.getElementById("fade");

const textEl = document.getElementById("text");

const buttonsEl = document.getElementById("buttons");

const endingScreen = document.getElementById("endingScreen");

const endingText = document.getElementById("endingText");

const nextEndingBtn = document.getElementById("nextEndingBtn");

/* ================= OUTSIDE CLICK SECRET ================= */

document.body.addEventListener("click",(e)=>{

    const border =
    document.getElementById("gameBorder");

    if(!border.contains(e.target)){

        outsideClicks++;

        if(outsideClicks >= 3){

            secretEnding();

        }

    }

});

/* ================= ROOMS ================= */

const rooms = {

foyer:{

name:"Foyer",

bg:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200",

text:"The foyer smells vaguely like wet carpet and ghosts.",

hotspots:[

{
x:"8%",
y:"40%",
w:"18%",
h:"35%",
label:"🍲 Kitchen",
type:"move",
action:()=>moveRoom("kitchen",120)
},

{
x:"70%",
y:"25%",
w:"20%",
h:"40%",
label:"🪜 Upstairs",
type:"move",
action:()=>moveRoom("upstairs",650)
},

{
x:"42%",
y:"18%",
w:"15%",
h:"35%",
label:"🖼 Bark Portrait (-1 Energy)",
type:"action",
action:()=>{

doAction(
"The portrait looks offended."
);

}

}

]

},

kitchen:{

name:"Kitchen",

bg:"https://images.unsplash.com/photo-1484154218962-a197022b5858?q=80&w=1200",

text:"Something inside the fridge whispers taxes.",

hotspots:[

{
x:"65%",
y:"30%",
w:"18%",
h:"35%",
label:"🦴 Cabinet",
type:"action",
action:()=>{

if(day === 1 && !foundItemToday){

inventory.push("Ghost Bone");

foundItemToday = true;

doAction(
"You found the Ghost Bone!"
);

}

else{

doAction(
"Only haunted soup."
);

}

}

},

{
x:"35%",
y:"45%",
w:"18%",
h:"20%",
label:"🧀 Eat Cheese (-1 Energy)",
type:"action",
action:()=>{

doAction(
"The cheese screams."
);

}

},

{
x:"5%",
y:"40%",
w:"15%",
h:"30%",
label:"⬅ Foyer",
type:"move",
action:()=>moveRoom("foyer",100)
}

]

},

upstairs:{

name:"Upstairs Hall",

bg:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200",

text:"A ghost vacuum cleaner stares aggressively.",

hotspots:[

{
x:"70%",
y:"25%",
w:"18%",
h:"45%",
label:"📚 Library",
type:"move",
action:()=>moveRoom("library",700)
},

{
x:"42%",
y:"42%",
w:"16%",
h:"18%",
label:"⚔ Fight Vacuum (-1 Energy)",
type:"action",
action:()=>{

doAction(
"The vacuum steals your dignity."
);

}

},

{
x:"8%",
y:"40%",
w:"15%",
h:"35%",
label:"⬇ Downstairs",
type:"move",
action:()=>moveRoom("foyer",100)
}

]

},

library:{

name:"Library",

bg:"https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1200",

text:"Books float through the air angrily.",

hotspots:[

{
x:"65%",
y:"20%",
w:"18%",
h:"55%",
label:"🔑 Bookshelf",
type:"action",
action:()=>{

if(day === 2 && !foundItemToday){

inventory.push("Rusty Key");

foundItemToday = true;

doAction(
"You found the Rusty Key!"
);

}

else{

doAction(
"The books hiss at Mochi."
);

}

}

},

{
x:"34%",
y:"50%",
w:"18%",
h:"15%",
label:"💨 Zoomies (-1 Energy)",
type:"action",
action:()=>{

doAction(
"Mochi becomes speed."
);

}

},

{
x:"84%",
y:"40%",
w:"10%",
h:"25%",
label:"🚪 Basement",
type:"move",
action:()=>moveRoom("basement",720)
},

{
x:"8%",
y:"40%",
w:"15%",
h:"35%",
label:"⬅ Upstairs",
type:"move",
action:()=>moveRoom("upstairs",100)
}

]

},

basement:{

name:"Basement",

bg:"https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1200",

text:"The basement is freezing cold.",

hotspots:[

{
x:"44%",
y:"28%",
w:"14%",
h:"32%",
label:"🕯 Candle",
type:"action",
action:()=>{

if(day === 3 && !foundItemToday){

inventory.push("Haunted Candle");

foundItemToday = true;

doAction(
"You found the Haunted Candle!"
);

}

else{

doAction(
"The darkness judges Mochi."
);

}

}

},

{
x:"18%",
y:"60%",
w:"18%",
h:"16%",
label:"🐾 Dig Floorboards (-1 Energy)",
type:"action",
action:()=>{

doAction(
"Mochi uncovers ancient dog treats."
);

}

},

{
x:"5%",
y:"40%",
w:"15%",
h:"30%",
label:"⬅ Library",
type:"move",
action:()=>moveRoom("library",100)
}

]

}

};

/* ================= UI ================= */

function updateUI(){

document.getElementById("day").innerHTML =
`🌙 Day ${day}/3`;

document.getElementById("energy").innerHTML =
`⚡ Energy: ${energy}`;

document.getElementById("inventory").innerHTML =
`🧸 ${inventory.join(", ") || "No Items"}`;

document.getElementById("location").innerHTML =
`📍 ${rooms[currentRoom].name}`;

}

/* ================= ENERGY ================= */

function spendEnergy(){

if(energy <= 0) return false;

energy--;

if(energy < 0){

energy = 0;

}

updateUI();

if(energy === 0){

lockDay();

}

return true;

}

/* ================= ACTION ================= */

function doAction(text){

if(energy <= 0) return;

spendEnergy();

textEl.innerHTML = text;

}

/* ================= LOCK DAY ================= */

function lockDay(){

clearHotspots();

buttonsEl.innerHTML = "";

const btn =
document.createElement("button");

btn.innerText =
"💤 Sleep";

btn.onclick = nextDay;

buttonsEl.appendChild(btn);

textEl.innerHTML =
"Mochi is too eepy.";

}

/* ================= MOVE ROOMS ================= */

function moveRoom(room,x){

fade.style.opacity = 1;

setTimeout(()=>{

currentRoom = room;

dog.style.left = x + "px";

loadRoom();

fade.style.opacity = 0;

},500);

}

/* ================= HOTSPOTS ================= */

function clearHotspots(){

document.querySelectorAll(".hotspot")
.forEach(h=>h.remove());

}

function loadRoom(){

updateUI();

clearHotspots();

roomEl.style.backgroundImage =
`linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), url('${rooms[currentRoom].bg}')`;

textEl.innerHTML =
rooms[currentRoom].text;

buttonsEl.innerHTML = "";

if(energy <= 0){

lockDay();

return;

}

rooms[currentRoom].hotspots.forEach(h=>{

const div =
document.createElement("div");

div.className = "hotspot";

div.style.left = h.x;

div.style.top = h.y;

div.style.width = h.w;

div.style.height = h.h;

div.onmouseenter = ()=>{

tooltip.style.display = "block";

tooltip.innerHTML =
`${h.label}<br><span style='font-size:12px;color:#ddd;'>click to interact</span>`;

};

div.onmousemove = (e)=>{

tooltip.style.left =
e.pageX + 15 + "px";

tooltip.style.top =
e.pageY + 15 + "px";

};

div.onmouseleave = ()=>{

tooltip.style.display = "none";

};

div.onclick = h.action;

roomEl.appendChild(div);

});

}

/* ================= NEXT DAY ================= */

function nextDay(){

day++;

energy = 3;

foundItemToday = false;

if(day > 3){

ending();

return;

}

loadRoom();

}

/* ================= ENDINGS ================= */

let endingLines = [];

let endingIndex = 0;

function startEnding(lines){

endingLines = lines;

endingIndex = 0;

endingScreen.style.display = "flex";

endingText.innerHTML =
endingLines[0];

}

nextEndingBtn.onclick = ()=>{

endingIndex++;

if(endingIndex >= endingLines.length){

location.reload();

return;

}

endingText.innerHTML =
endingLines[endingIndex];

};

function ending(){

if(inventory.length === 3){

startEnding([

"⭐ TRUE ENDING ⭐",

"Mochi collected every relic.",

"The mansion begins to collapse.",

"The ghosts salute Mochi respectfully.",

"Mochi escapes into freedom carrying the candle proudly in his mouth. 🐶"

]);

}

else{

startEnding([

"👑 BAD ENDING 👑",

"Mochi failed to gather every relic.",

"The ghosts crown him king.",

"He becomes THE DREAD LORD OF BARKNESS.",

"Honestly he seems pretty happy about it."

]);

}

}

function secretEnding(){

startEnding([

"💥 SECRET ENDING 💥",

" The forbidden sequence is complete.",

" Reality begins buffering.",

"Mochi slowly turns toward the player.",

"'wait... im trapped inside html?'",

"The universe immediately EXPLODES."

]);

}

/* ================= START ================= */

loadRoom();

</script>

</body>
</html>
