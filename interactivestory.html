# Interactive Haunted Doggy Mansion (HTML)

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mochi's Haunted Mansion</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    background:#000;
}

.room{
    width:100%;
    height:100%;
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
}

#ui{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.82);
    padding:18px;
    box-sizing:border-box;
    border-top:3px solid #b983ff;
}

#topBar{
    display:flex;
    gap:25px;
    margin-bottom:10px;
    color:#f5d0fe;
    font-size:18px;
    flex-wrap:wrap;
}

#text{
    min-height:70px;
    line-height:1.5;
    font-size:18px;
}

#buttons{
    margin-top:12px;
}

button{
    background:#a855f7;
    border:none;
    color:white;
    padding:10px 15px;
    border-radius:12px;
    cursor:pointer;
    margin:6px;
    transition:0.2s;
    font-size:15px;
}

button:hover{
    transform:scale(1.05);
    background:#c084fc;
}

.hotspot{
    position:absolute;
    border:2px dashed rgba(255,255,255,0.4);
    cursor:pointer;
    transition:0.2s;
}

.hotspot:hover{
    background:rgba(255,255,255,0.15);
}

#dog{
    position:absolute;
    width:110px;
    bottom:170px;
    left:120px;
    transition:0.5s;
    z-index:5;
}

#endingScreen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:none;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
    box-sizing:border-box;
    z-index:20;
}

#endingBox{
    max-width:800px;
}

h1{
    color:#fde68a;
}

.small{
    color:#ddd;
    font-size:14px;
}

</style>
</head>

<body>

<div id="game">

    <div id="room" class="room"></div>

    <img id="dog" src="https://cdn-icons-png.flaticon.com/512/616/616408.png">

    <div id="ui">

        <div id="topBar">
            <div id="day"></div>
            <div id="energy"></div>
            <div id="inventory"></div>
            <div id="location"></div>
        </div>

        <div id="text"></div>

        <div id="buttons"></div>

    </div>

    <div id="endingScreen">
        <div id="endingBox"></div>
    </div>

</div>

<script>

let day = 1;
let energy = 3;
let inventory = [];
let currentRoom = "foyer";
let secret = [];

const roomEl = document.getElementById("room");
const textEl = document.getElementById("text");
const buttonsEl = document.getElementById("buttons");
const dog = document.getElementById("dog");
const endingScreen = document.getElementById("endingScreen");
const endingBox = document.getElementById("endingBox");

const rooms = {

foyer:{
    name:"Foyer",
    bg:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop",
    text:"Mochi stands in the haunted foyer. The chandelier flickers ominously. A portrait appears to be judging you.",
    hotspots:[

        {
            x:"8%",
            y:"35%",
            w:"18%",
            h:"35%",
            label:"Go to Kitchen 🍲",
            action:()=>moveRoom("kitchen",80)
        },

        {
            x:"72%",
            y:"25%",
            w:"20%",
            h:"45%",
            label:"Go Upstairs 🪜",
            action:()=>moveRoom("upstairs",620)
        },

        {
            x:"42%",
            y:"18%",
            w:"16%",
            h:"38%",
            label:"Bark at Portrait 🖼",
            action:()=>{

                addSecret("bark");

                spendEnergy();

                setText("Mochi barks at the haunted portrait. The portrait sighs dramatically. 'wow okay rude.'");
            }
        }
    ]
},

kitchen:{
    name:"Kitchen",
    bg:"https://images.unsplash.com/photo-1484154218962-a197022b5858?q=80&w=1200&auto=format&fit=crop",
    text:"Floating soup pots drift through the kitchen. Something in the fridge is breathing.",
    hotspots:[

        {
            x:"70%",
            y:"30%",
            w:"16%",
            h:"35%",
            label:"Open Cabinet 🦴",
            action:()=>{

                spendEnergy();

                if(!inventory.includes("Ghost Bone")){

                    inventory.push("Ghost Bone");

                    setText("Mochi discovers the 🦴 Ghost Bone hidden behind haunted soup cans. The soup applauds politely.");
                }
                else{
                    setText("Just more soup. So much soup.");
                }

                updateUI();
            }
        },

        {
            x:"5%",
            y:"35%",
            w:"15%",
            h:"30%",
            label:"Return to Foyer",
            action:()=>moveRoom("foyer",120)
        },

        {
            x:"40%",
            y:"45%",
            w:"15%",
            h:"20%",
            label:"Steal Cheese 🧀",
            action:()=>{

                spendEnergy();

                setText("The cursed cheese screams. Mochi screams back.");
            }
        }
    ]
},

upstairs:{
    name:"Upstairs Hall",
    bg:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop",
    text:"A ghost vacuum cleaner patrols the hallway aggressively.",
    hotspots:[

        {
            x:"75%",
            y:"30%",
            w:"15%",
            h:"45%",
            label:"Enter Library 📚",
            action:()=>moveRoom("library",650)
        },

        {
            x:"10%",
            y:"35%",
            w:"18%",
            h:"40%",
            label:"Go Back Down",
            action:()=>moveRoom("foyer",120)
        },

        {
            x:"45%",
            y:"45%",
            w:"18%",
            h:"18%",
            label:"Fight Vacuum ⚔",
            action:()=>{

                spendEnergy();

                setText("Mochi loses immediately. The vacuum steals a sock and leaves triumphantly.");
            }
        }
    ]
},

library:{
    name:"Library",
    bg:"https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1200&auto=format&fit=crop",
    text:"Books float through the air like angry pigeons.",
    hotspots:[

        {
            x:"65%",
            y:"20%",
            w:"18%",
            h:"55%",
            label:"Inspect Shelf 🔑",
            action:()=>{

                spendEnergy();

                if(!inventory.includes("Rusty Key")){

                    inventory.push("Rusty Key");

                    setText("Behind the shelf is the 🔑 Rusty Key. A dictionary bonks Mochi approvingly.");
                }
                else{
                    setText("The shelf only contains terrifying tax documents from 1892.");
                }

                updateUI();
            }
        },

        {
            x:"10%",
            y:"40%",
            w:"15%",
            h:"30%",
            label:"Return Hallway",
            action:()=>moveRoom("upstairs",100)
        },

        {
            x:"35%",
            y:"50%",
            w:"18%",
            h:"15%",
            label:"Do Zoomies 💨",
            action:()=>{

                addSecret("zoomies");

                spendEnergy();

                setText("Mochi performs incredible high-speed zoomies. The ghosts clap politely.");
            }
        },

        {
            x:"85%",
            y:"40%",
            w:"10%",
            h:"25%",
            label:"Basement Door 🚪",
            action:()=>moveRoom("basement",720)
        }
    ]
},

basement:{
    name:"Basement",
    bg:"https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1200&auto=format&fit=crop",
    text:"The basement is freezing cold. Shadows twitch along the walls.",
    hotspots:[

        {
            x:"45%",
            y:"28%",
            w:"12%",
            h:"30%",
            label:"Take Candle 🕯",
            action:()=>{

                spendEnergy();

                if(!inventory.includes("Haunted Candle")){

                    inventory.push("Haunted Candle");

                    setText("Mochi grabs the 🕯 Haunted Candle. The mansion groans loudly.");
                }
                else{
                    setText("The darkness stares back at Mochi respectfully.");
                }

                updateUI();
            }
        },

        {
            x:"20%",
            y:"60%",
            w:"18%",
            h:"15%",
            label:"Dig Floorboards 🐾",
            action:()=>{

                addSecret("dig");

                spendEnergy();

                setText("Mochi uncovers ancient dog treats from 1881.");
            }
        },

        {
            x:"5%",
            y:"35%",
            w:"15%",
            h:"35%",
            label:"Return Library",
            action:()=>moveRoom("library",100)
        }
    ]
}

};

function updateUI(){

    document.getElementById("day").innerHTML = `🌙 Day ${day}/3`;
    document.getElementById("energy").innerHTML = `⚡ Energy: ${energy}`;
    document.getElementById("inventory").innerHTML = `🧸 ${inventory.join(", ") || "No Items"}`;
    document.getElementById("location").innerHTML = `📍 ${rooms[currentRoom].name}`;
}

function setText(t){
    textEl.innerHTML = t;
}

function clearHotspots(){

    document.querySelectorAll(".hotspot").forEach(e=>e.remove());
}

function loadRoom(){

    updateUI();

    clearHotspots();

    const room = rooms[currentRoom];

    roomEl.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.55)), url('${room.bg}')`;

    setText(room.text);

    room.hotspots.forEach(h=>{

        const div = document.createElement("div");

        div.className = "hotspot";

        div.style.left = h.x;
        div.style.top = h.y;
        div.style.width = h.w;
        div.style.height = h.h;

        div.title = h.label;

        div.onclick = h.action;

        roomEl.appendChild(div);
    });

    buttonsEl.innerHTML = "";

    if(energy <= 0){

        const btn = document.createElement("button");

        btn.innerText = "Sleep Until Next Day 💤";

        btn.onclick = nextDay;

        buttonsEl.appendChild(btn);
    }
}

function moveRoom(room, x){

    if(energy <= 0) return;

    spendEnergy();

    currentRoom = room;

    dog.style.left = x + "px";

    loadRoom();
}

function spendEnergy(){

    energy--;

    updateUI();

    if(energy <= 0){

        setText("Mochi is too eepy to continue exploring today.");
    }
}

function nextDay(){

    day++;

    energy = 3;

    if(day > 3){

        ending();

        return;
    }

    setText("Morning somehow arrives despite the mansion violating several laws of reality.");

    loadRoom();
}

function addSecret(word){

    secret.push(word);

    if(secret.length > 3){
        secret.shift();
    }

    if(
        secret[0] === "bark" &&
        secret[1] === "zoomies" &&
        secret[2] === "dig"
    ){
        secretEnding();
    }
}

function ending(){

    endingScreen.style.display = "flex";

    if(inventory.length === 3){

        endingBox.innerHTML = `
        <h1>⭐ TRUE ENDING ⭐</h1>

        Mochi collected all 3 relics.<br><br>

        The curse shatters apart.<br><br>

        The mansion screams as sunlight floods the halls.<br><br>

        Mochi escapes into freedom carrying the haunted candle proudly in his mouth. 🐶<br><br>

        <button onclick="location.reload()">Play Again</button>
        `;
    }
    else{

        endingBox.innerHTML = `
        <h1>👑 BAD ENDING 👑</h1>

        Mochi failed to gather every relic.<br><br>

        The ghosts crown him the new ruler of the mansion forever.<br><br>

        He becomes:<br><br>

        <b>THE DREAD LORD OF BARKNESS</b><br><br>

        honestly he seems pretty happy about it<br><br>

        <button onclick="location.reload()">Play Again</button>
        `;
    }
}

function secretEnding(){

    endingScreen.style.display = "flex";

    endingBox.innerHTML = `

    <h1>💥 SECRET ENDING 💥</h1>

    The forbidden sequence is complete.<br><br>

    Reality begins buffering.<br><br>

    Mochi slowly turns toward YOU.<br><br>

    "wait... im trapped inside html?"<br><br>

    The universe collapses into corrupted png files and squeaky toy noises.<br><br>

    EVERYTHING EXPLODES.<br><br>

    <button onclick="location.reload()">Reboot Reality</button>
    `;
}

loadRoom();

</script>

</body>
</html>
