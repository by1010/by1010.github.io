<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi's Haunted Mansion</title>

<style>

body{
    margin:0;
    font-family: "Trebuchet MS", sans-serif;
    background:#111;
    color:white;
    overflow:hidden;
}

#game{
    width:100vw;
    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
    url("https://images.unsplash.com/photo-1518780664697-55e3ad937233?q=80&w=1200&auto=format&fit=crop");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

.panel{
    width:850px;
    max-width:92%;
    background:rgba(20,20,20,0.94);
    border:3px solid #c084fc;
    border-radius:24px;
    padding:25px;
    box-shadow:0 0 30px #a855f7;
}

h1{
    margin-top:0;
    text-align:center;
    color:#f5d0fe;
}

#top{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:18px;
    color:#ddd6fe;
}

#story{
    min-height:180px;
    line-height:1.7;
    font-size:18px;
}

#choices{
    margin-top:15px;
}

button{
    background:#a855f7;
    color:white;
    border:none;
    border-radius:14px;
    padding:12px 18px;
    margin:8px;
    cursor:pointer;
    transition:0.2s;
    font-size:15px;
}

button:hover{
    background:#c084fc;
    transform:scale(1.05);
}

#inventory{
    margin-top:18px;
    color:#e9d5ff;
}

.room{
    color:#fde68a;
    font-size:22px;
}

.small{
    color:#ccc;
    font-size:15px;
}

.ending{
    text-align:center;
    font-size:22px;
    line-height:1.8;
    color:#fde68a;
}

</style>
</head>

<body>

<div id="game">

<div class="panel">

<h1>🐶 Mochi's Haunted Mansion</h1>

<div id="top">
<div id="day"></div>
<div id="energy"></div>
<div id="room"></div>
<div id="items"></div>
</div>

<div id="story"></div>

<div id="choices"></div>

<div id="inventory"></div>

</div>
</div>

<script>

let day = 1;
let energy = 3;

let currentRoom = "Foyer";

let inventory = [];

let secretCode = [];

const story = document.getElementById("story");
const choices = document.getElementById("choices");

const mansion = {

    "Foyer":{
        text:`
        <div class="room">🏚 Foyer</div><br>

        Dusty portraits line the walls.<br><br>

        One portrait quietly growls at Mochi.<br><br>

        A staircase leads upward while dark hallways stretch deeper into the mansion.
        `,
        moves:["Kitchen","Library","Upstairs Hall"],
        actions:[
            {
                name:"Bark at portrait 🖼",
                effect:()=>{
                    secret("bark");

                    story.innerHTML = `
                    Mochi barks loudly.<br><br>

                    The portrait gasps dramatically.<br><br>

                    "wow rude."
                    `;
                }
            }
        ]
    },

    "Kitchen":{
        text:`
        <div class="room">🍲 Kitchen</div><br>

        Pots float through the air by themselves.<br><br>

        Something in the fridge is breathing.
        `,
        moves:["Foyer","Dining Room"],
        actions:[
            {
                name:"Open cabinet 🦴",
                effect:()=>{

                    if(!inventory.includes("Ghost Bone")){

                        inventory.push("Ghost Bone");

                        story.innerHTML = `
                        Mochi discovers the 🦴 Ghost Bone hidden behind haunted soup cans!<br><br>

                        The soup applauds politely.
                        `;
                    }
                    else{

                        story.innerHTML = `
                        Mochi checks the cabinet again.<br><br>

                        Just more soup.
                        `;
                    }

                    update();
                }
            },

            {
                name:"Steal cursed cheese 🧀",
                effect:()=>{

                    story.innerHTML = `
                    The cheese screams when touched.<br><br>

                    Mochi screams back.
                    `;
                }
            }
        ]
    },

    "Library":{
        text:`
        <div class="room">📚 Library</div><br>

        Floating books zoom around the room like angry pigeons.<br><br>

        One bookshelf seems slightly crooked.
        `,
        moves:["Foyer","Study"],
        actions:[
            {
                name:"Inspect bookshelf 🔑",
                effect:()=>{

                    if(!inventory.includes("Rusty Key")){

                        inventory.push("Rusty Key");

                        story.innerHTML = `
                        Behind the shelf is the 🔑 Rusty Key!<br><br>

                        A dictionary bonks Mochi approvingly.
                        `;
                    }

                    else{

                        story.innerHTML = `
                        The bookshelf contains only tax documents from 1894.<br><br>

                        Horrifying.
                        `;
                    }

                    update();
                }
            },

            {
                name:"Do zoomies 💨",
                effect:()=>{

                    secret("zoomies");

                    story.innerHTML = `
                    Mochi runs through the library at MACH SPEED.<br><br>

                    Several ghosts rate the performance 9/10.
                    `;
                }
            }
        ]
    },

    "Dining Room":{
        text:`
        <div class="room">🍽 Dining Room</div><br>

        A ghost family silently eats invisible spaghetti.<br><br>

        One ghost politely offers Mochi a meatball.
        `,
        moves:["Kitchen"],
        actions:[
            {
                name:"Accept meatball 🍝",
                effect:()=>{

                    story.innerHTML = `
                    The meatball phases through Mochi's face.<br><br>

                    Still somehow delicious.
                    `;
                }
            }
        ]
    },

    "Study":{
        text:`
        <div class="room">🕯 Study</div><br>

        The room smells like dust and bad decisions.<br><br>

        A tiny cursed crown sits on the desk.
        `,
        moves:["Library","Basement"],
        actions:[
            {
                name:"Wear cursed crown 👑",
                effect:()=>{

                    story.innerHTML = `
                    Mochi becomes temporary CEO of ghosts.<br><br>

                    The promotion lasts 4 seconds.
                    `;
                }
            }
        ]
    },

    "Upstairs Hall":{
        text:`
        <div class="room">🪜 Upstairs Hall</div><br>

        The floor creaks ominously.<br><br>

        A ghost vacuum cleaner patrols the hallway aggressively.
        `,
        moves:["Foyer","Bedroom"],
        actions:[
            {
                name:"Challenge vacuum cleaner ⚔",
                effect:()=>{

                    story.innerHTML = `
                    Mochi loses immediately.<br><br>

                    The vacuum steals one sock and leaves triumphantly.
                    `;
                }
            }
        ]
    },

    "Bedroom":{
        text:`
        <div class="room">🛏 Bedroom</div><br>

        Tiny ghost puppies nap peacefully on the bed.<br><br>

        One snores very loudly.
        `,
        moves:["Upstairs Hall"],
        actions:[
            {
                name:"Nap with ghost puppies 💤",
                effect:()=>{

                    story.innerHTML = `
                    Mochi takes a tiny nap.<br><br>

                    Everyone wakes up emotionally refreshed.
                    `;
                }
            }
        ]
    },

    "Basement":{
        text:`
        <div class="room">🕯 Basement</div><br>

        The air is freezing cold.<br><br>

        Shadows move strangely along the walls.<br><br>

        A glowing candle flickers in the darkness.
        `,
        moves:["Study"],
        actions:[
            {
                name:"Take haunted candle 🕯",
                effect:()=>{

                    if(!inventory.includes("Haunted Candle")){

                        inventory.push("Haunted Candle");

                        story.innerHTML = `
                        Mochi carefully grabs the 🕯 Haunted Candle.<br><br>

                        The mansion groans loudly.<br><br>

                        It knows you're close to escaping.
                        `;
                    }

                    else{

                        story.innerHTML = `
                        Mochi stares at the darkness.<br><br>

                        The darkness stares back.
                        `;
                    }

                    update();
                }
            },

            {
                name:"Dig at floorboards 🐾",
                effect:()=>{

                    secret("dig");

                    story.innerHTML = `
                    Mochi digs furiously.<br><br>

                    You uncover ancient dog treats from 1882.
                    `;
                }
            }
        ]
    }

};

function update(){

    document.getElementById("day").innerHTML =
    `🌙 Day ${day}/3`;

    document.getElementById("energy").innerHTML =
    `⚡ Energy: ${energy}`;

    document.getElementById("room").innerHTML =
    `📍 ${currentRoom}`;

    document.getElementById("items").innerHTML =
    `🧸 ${inventory.length}/3 Items`;

    document.getElementById("inventory").innerHTML =
    `Inventory: ${inventory.length ? inventory.join(", ") : "nothing yet..."}`;
}

function clearChoices(){
    choices.innerHTML = "";
}

function addChoice(name, func){

    const btn = document.createElement("button");

    btn.innerText = name;

    btn.onclick = func;

    choices.appendChild(btn);
}

function spendEnergy(){

    energy--;

    update();

    if(energy <= 0){

        clearChoices();

        addChoice("Sleep until next day 💤", nextDay);
    }
}

function move(room){

    if(energy <= 0) return;

    currentRoom = room;

    spendEnergy();

    loadRoom();
}

function loadRoom(){

    update();

    clearChoices();

    const room = mansion[currentRoom];

    story.innerHTML = room.text;

    room.moves.forEach(place=>{

        addChoice(`Go to ${place} ➜`, ()=>{

            move(place);

        });

    });

    room.actions.forEach(action=>{

        addChoice(action.name, ()=>{

            if(energy <= 0) return;

            spendEnergy();

            action.effect();

        });

    });

}

function nextDay(){

    day++;

    energy = 3;

    if(day > 3){

        ending();

        return;
    }

    story.innerHTML = `
    Morning arrives somehow despite the mansion violating several laws of reality.<br><br>

    Mochi stretches dramatically.
    `;

    clearChoices();

    addChoice("Continue 🌙", ()=>{

        loadRoom();

    });

    update();
}

function secret(action){

    secretCode.push(action);

    if(secretCode.length > 3){

        secretCode.shift();
    }

    if(
        secretCode[0] === "bark" &&
        secretCode[1] === "zoomies" &&
        secretCode[2] === "dig"
    ){

        universeEnding();
    }

}

function ending(){

    clearChoices();

    if(inventory.length === 3){

        story.innerHTML = `
        <div class="ending">

        ⭐ TRUE ENDING ⭐<br><br>

        The 3 relics begin glowing brightly.<br><br>

        The curse shatters apart.<br><br>

        The mansion screams as sunlight floods inside.<br><br>

        Mochi runs out the front door into freedom. 🐶<br><br>

        The ghost cat watches proudly from the window.<br><br>

        "...good dog."

        </div>
        `;
    }

    else{

        story.innerHTML = `
        <div class="ending">

        👑 BAD ENDING 👑<br><br>

        Mochi failed to collect every relic.<br><br>

        The mansion accepts him as its new ruler forever.<br><br>

        Tiny ghost servants place a cursed fluffy cape on him.<br><br>

        He becomes:
        <br><br>

        <b>THE DREAD LORD OF BARKNESS</b>
        <br><br>

        honestly he seems very happy about this

        </div>
        `;
    }

    addChoice("Play Again 🔄", restart);

}

function universeEnding(){

    clearChoices();

    story.innerHTML = `
    <div class="ending">

    💥 SECRET ENDING 💥<br><br>

    The forbidden sequence is complete.<br><br>

    Reality begins buffering.<br><br>

    The walls unzip themselves.<br><br>

    Mochi slowly turns toward YOU.<br><br>

    "...wait. im inside html?"<br><br>

    A ghost opens Notepad.<br><br>

    The universe collapses into corrupted PNG files and squeaky toy noises.<br><br>

    EVERYTHING EXPLODES.

    </div>
    `;

    addChoice("Reboot Reality 🔁", restart);

}

function restart(){

    day = 1;
    energy = 3;
    currentRoom = "Foyer";

    inventory = [];

    secretCode = [];

    update();

    intro();

}

function intro(){

    story.innerHTML = `
    Tiny puppy Mochi is trapped inside a haunted mansion during a thunderstorm. 🌧<br><br>

    Find all 3 relics in 3 days to escape:
    <br><br>

    🦴 Ghost Bone<br>
    🔑 Rusty Key<br>
    🕯 Haunted Candle
    <br><br>

    Explore carefully.<br><br>

    You only have 3 energy each day.
    `;

    clearChoices();

    addChoice("Enter the mansion 🐾", ()=>{

        loadRoom();

    });

    update();
}

intro();

</script>

</body>
</html>
