<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi's Haunted Mansion</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
    color:white;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* ================= ROOM ================= */

#room{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    transition:0.5s;
    animation:flicker 5s infinite;
}

/* ================= LIGHT FLICKER ================= */

@keyframes flicker{

    0%{ filter:brightness(1); }
    5%{ filter:brightness(0.7); }
    7%{ filter:brightness(1.1); }
    10%{ filter:brightness(0.6); }
    11%{ filter:brightness(1); }
    55%{ filter:brightness(1); }
    56%{ filter:brightness(0.5); }
    58%{ filter:brightness(1); }
    100%{ filter:brightness(1); }

}

/* ================= GHOSTS ================= */

.ghost{

    position:absolute;
    width:120px;
    opacity:0.7;
    pointer-events:none;
    animation:floatGhost 7s ease-in-out infinite;

}

@keyframes floatGhost{

    0%{
        transform:translateY(0px) translateX(0px);
    }

    50%{
        transform:translateY(-20px) translateX(15px);
    }

    100%{
        transform:translateY(0px) translateX(0px);
    }

}

/* ================= DOG ================= */

#dog{

    position:absolute;
    width:120px;
    bottom:170px;
    left:120px;
    z-index:10;
    transition:0.5s;

}

/* ================= HOTSPOTS ================= */

.hotspot{

    position:absolute;
    border:2px dashed rgba(255,255,255,0.15);
    cursor:pointer;
    transition:0.2s;
    z-index:5;
}

.hotspot:hover{

    background:rgba(255,255,255,0.2);
    border:2px solid rgba(255,255,255,0.7);

}

/* ================= TOOLTIP ================= */

#tooltip{

    position:absolute;
    display:none;
    padding:10px 12px;
    background:rgba(0,0,0,0.85);
    border:2px solid #c084fc;
    border-radius:12px;
    color:#f5d0fe;
    z-index:50;
    pointer-events:none;
    font-size:15px;
    font-weight:bold;

}

/* ================= UI ================= */

#ui{

    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.86);
    border-top:3px solid #b983ff;
    padding:18px;
    box-sizing:border-box;
    z-index:20;

}

#topBar{

    display:flex;
    gap:20px;
    flex-wrap:wrap;
    color:#f5d0fe;
    margin-bottom:10px;
    font-size:18px;

}

#text{

    min-height:70px;
    line-height:1.6;
    font-size:18px;

}

button{

    background:#a855f7;
    border:none;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    margin-top:10px;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;

}

button:hover{

    background:#c084fc;
    transform:scale(1.05);

}

/* ================= ENDINGS ================= */

#endingScreen{

    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.94);
    display:none;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:100;
    padding:30px;
    box-sizing:border-box;

}

#endingBox{

    max-width:800px;
    line-height:1.8;
    font-size:24px;
    color:#fde68a;

}

</style>
</head>

<body>

<div id="game">

    <div id="room"></div>

    <!-- FLOATING GHOSTS -->

    <img class="ghost"
    src="https://cdn-icons-png.flaticon.com/512/3094/3094835.png"
    style="top:12%; left:8%; animation-duration:6s;">

    <img class="ghost"
    src="https://cdn-icons-png.flaticon.com/512/3094/3094835.png"
    style="top:25%; right:10%; width:90px; animation-duration:9s;">

    <img class="ghost"
    src="https://cdn-icons-png.flaticon.com/512/3094/3094835.png"
    style="bottom:30%; left:70%; width:100px; animation-duration:8s;">

    <!-- DOG -->

    <img id="dog"
    src="https://cdn-icons-png.flaticon.com/512/616/616408.png">

    <!-- TOOLTIP -->

    <div id="tooltip"></div>

    <!-- UI -->

    <div id="ui">

        <div id="topBar">

            <div id="day"></div>
            <div id="energy"></div>
            <div id="inventory"></div>
            <div id="location"></div>

        </div>

        <div id="text"></div>

        <div id="buttons"></div>

    </div>

    <!-- ENDING SCREEN -->

    <div id="endingScreen">

        <div id="endingBox"></div>

    </div>

</div>

<script>

/* ================= GAME STATE ================= */

let day = 1;
let energy = 3;

let inventory = [];

let currentRoom = "foyer";

let secret = [];

/* ================= ELEMENTS ================= */

const roomEl = document.getElementById("room");

const dog = document.getElementById("dog");

const tooltip = document.getElementById("tooltip");

const textEl = document.getElementById("text");

const buttonsEl = document.getElementById("buttons");

const endingScreen = document.getElementById("endingScreen");

const endingBox = document.getElementById("endingBox");

/* ================= ROOMS ================= */

const rooms = {

    foyer:{

        name:"Foyer",

        bg:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop",

        text:"Mochi stands in the haunted foyer. The chandelier flickers ominously.",

        hotspots:[

            {
                x:"8%",
                y:"40%",
                w:"18%",
                h:"35%",
                label:"🍲 Go to Kitchen",
                type:"move",
                action:()=>moveRoom("kitchen",90)
            },

            {
                x:"72%",
                y:"22%",
                w:"20%",
                h:"48%",
                label:"🪜 Go Upstairs",
                type:"move",
                action:()=>moveRoom("upstairs",650)
            },

            {
                x:"42%",
                y:"18%",
                w:"15%",
                h:"35%",
                label:"🖼 Bark at Portrait (-1 Energy)",
                type:"action",
                action:()=>{

                    addSecret("bark");

                    doAction(
                        "Mochi barks loudly. The haunted portrait sighs dramatically. 'wow okay rude.'"
                    );

                }
            }

        ]

    },

    kitchen:{

        name:"Kitchen",

        bg:"https://images.unsplash.com/photo-1484154218962-a197022b5858?q=80&w=1200&auto=format&fit=crop",

        text:"Floating soup pots drift through the air. Something in the fridge is breathing.",

        hotspots:[

            {
                x:"70%",
                y:"28%",
                w:"18%",
                h:"38%",
                label:"🦴 Open Cabinet (-1 Energy)",
                type:"action",
                action:()=>{

                    if(!inventory.includes("Ghost Bone")){

                        inventory.push("Ghost Bone");

                        doAction(
                            "Mochi discovers the 🦴 Ghost Bone hidden behind haunted soup cans. The soup applauds politely."
                        );

                    }

                    else{

                        doAction(
                            "Mochi checks the cabinet again. Still just soup."
                        );

                    }

                }
            },

            {
                x:"40%",
                y:"45%",
                w:"15%",
                h:"18%",
                label:"🧀 Steal Cursed Cheese (-1 Energy)",
                type:"action",
                action:()=>{

                    doAction(
                        "The cursed cheese screams. Mochi screams back."
                    );

                }
            },

            {
                x:"5%",
                y:"40%",
                w:"15%",
                h:"30%",
                label:"⬅ Return to Foyer",
                type:"move",
                action:()=>moveRoom("foyer",120)
            }

        ]

    },

    upstairs:{

        name:"Upstairs Hall",

        bg:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop",

        text:"A ghost vacuum cleaner patrols the hallway aggressively.",

        hotspots:[

            {
                x:"74%",
                y:"28%",
                w:"15%",
                h:"42%",
                label:"📚 Enter Library",
                type:"move",
                action:()=>moveRoom("library",680)
            },

            {
                x:"10%",
                y:"40%",
                w:"15%",
                h:"35%",
                label:"⬇ Go Downstairs",
                type:"move",
                action:()=>moveRoom("foyer",120)
            },

            {
                x:"42%",
                y:"42%",
                w:"18%",
                h:"18%",
                label:"⚔ Fight Vacuum (-1 Energy)",
                type:"action",
                action:()=>{

                    doAction(
                        "Mochi loses instantly. The vacuum steals a sock and leaves triumphantly."
                    );

                }
            }

        ]

    },

    library:{

        name:"Library",

        bg:"https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1200&auto=format&fit=crop",

        text:"Books float through the air like angry pigeons.",

        hotspots:[

            {
                x:"65%",
                y:"20%",
                w:"18%",
                h:"55%",
                label:"🔑 Inspect Bookshelf (-1 Energy)",
                type:"action",
                action:()=>{

                    if(!inventory.includes("Rusty Key")){

                        inventory.push("Rusty Key");

                        doAction(
                            "Behind the shelf is the 🔑 Rusty Key. A dictionary bonks Mochi approvingly."
                        );

                    }

                    else{

                        doAction(
                            "The bookshelf only contains horrifying tax documents from 1892."
                        );

                    }

                }
            },

            {
                x:"35%",
                y:"50%",
                w:"18%",
                h:"15%",
                label:"💨 Do Zoomies (-1 Energy)",
                type:"action",
                action:()=>{

                    addSecret("zoomies");

                    doAction(
                        "Mochi performs incredible high-speed zoomies. The ghosts clap politely."
                    );

                }
            },

            {
                x:"84%",
                y:"40%",
                w:"10%",
                h:"25%",
                label:"🚪 Enter Basement",
                type:"move",
                action:()=>moveRoom("basement",720)
            },

            {
                x:"10%",
                y:"40%",
                w:"15%",
                h:"30%",
                label:"⬅ Return Upstairs",
                type:"move",
                action:()=>moveRoom("upstairs",100)
            }

        ]

    },

    basement:{

        name:"Basement",

        bg:"https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1200&auto=format&fit=crop",

        text:"The basement is freezing cold. Shadows twitch along the walls.",

        hotspots:[

            {
                x:"45%",
                y:"28%",
                w:"12%",
                h:"30%",
                label:"🕯 Take Candle (-1 Energy)",
                type:"action",
                action:()=>{

                    if(!inventory.includes("Haunted Candle")){

                        inventory.push("Haunted Candle");

                        doAction(
                            "Mochi grabs the 🕯 Haunted Candle. The mansion groans loudly."
                        );

                    }

                    else{

                        doAction(
                            "The darkness stares at Mochi respectfully."
                        );

                    }

                }
            },

            {
                x:"18%",
                y:"60%",
                w:"18%",
                h:"16%",
                label:"🐾 Dig Floorboards (-1 Energy)",
                type:"action",
                action:()=>{

                    addSecret("dig");

                    doAction(
                        "Mochi uncovers ancient dog treats from 1881."
                    );

                }
            },

            {
                x:"5%",
                y:"40%",
                w:"15%",
                h:"30%",
                label:"⬅ Return Library",
                type:"move",
                action:()=>moveRoom("library",100)
            }

        ]

    }

};

/* ================= UPDATE UI ================= */

function updateUI(){

    document.getElementById("day").innerHTML =
    `🌙 Day ${day}/3`;

    document.getElementById("energy").innerHTML =
    `⚡ Energy: ${energy}`;

    document.getElementById("inventory").innerHTML =
    `🧸 ${inventory.join(", ") || "No Items"}`;

    document.getElementById("location").innerHTML =
    `📍 ${rooms[currentRoom].name}`;

}

/* ================= ENERGY ================= */

function spendEnergy(){

    if(energy <= 0) return false;

    energy--;

    if(energy < 0){

        energy = 0;

    }

    updateUI();

    if(energy === 0){

        lockDay();

    }

    return true;

}

/* ================= ACTION ================= */

function doAction(text){

    if(energy <= 0) return;

    spendEnergy();

    textEl.innerHTML = text;

    updateUI();

}

/* ================= LOCK DAY ================= */

function lockDay(){

    clearHotspots();

    buttonsEl.innerHTML = "";

    const sleepBtn = document.createElement("button");

    sleepBtn.innerText = "💤 Sleep Until Next Day";

    sleepBtn.onclick = nextDay;

    buttonsEl.appendChild(sleepBtn);

    textEl.innerHTML =
    "Mochi is too eepy to continue exploring today.";

}

/* ================= MOVEMENT ================= */

function moveRoom(room,x){

    currentRoom = room;

    dog.style.left = x + "px";

    loadRoom();

}

/* ================= CLEAR HOTSPOTS ================= */

function clearHotspots(){

    document.querySelectorAll(".hotspot")
    .forEach(h=>h.remove());

}

/* ================= LOAD ROOM ================= */

function loadRoom(){

    updateUI();

    clearHotspots();

    roomEl.style.backgroundImage =
    `linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.6)), url('${rooms[currentRoom].bg}')`;

    textEl.innerHTML = rooms[currentRoom].text;

    buttonsEl.innerHTML = "";

    if(energy <= 0){

        lockDay();

        return;

    }

    rooms[currentRoom].hotspots.forEach(h=>{

        const div = document.createElement("div");

        div.className = "hotspot";

        div.style.left = h.x;
        div.style.top = h.y;
        div.style.width = h.w;
        div.style.height = h.h;

        div.onmouseenter = (e)=>{

            tooltip.style.display = "block";

            tooltip.innerHTML =
            `${h.label}<br><span style="font-size:12px;color:#ddd;">click to interact</span>`;

        };

        div.onmousemove = (e)=>{

            tooltip.style.left = e.pageX + 12 + "px";

            tooltip.style.top = e.pageY + 12 + "px";

        };

        div.onmouseleave = ()=>{

            tooltip.style.display = "none";

        };

        div.onclick = ()=>{

            if(h.type === "action" && energy <= 0){

                return;

            }

            h.action();

        };

        roomEl.appendChild(div);

    });

}

/* ================= NEXT DAY ================= */

function nextDay(){

    day++;

    energy = 3;

    if(day > 3){

        ending();

        return;

    }

    loadRoom();

}

/* ================= SECRET ================= */

function addSecret(word){

    secret.push(word);

    if(secret.length > 3){

        secret.shift();

    }

    if(
        secret[0] === "bark" &&
        secret[1] === "zoomies" &&
        secret[2] === "dig"
    ){

        secretEnding();

    }

}

/* ================= NORMAL ENDING ================= */

function ending(){

    endingScreen.style.display = "flex";

    if(inventory.length === 3){

        endingBox.innerHTML = `

        ⭐ TRUE ENDING ⭐
        <br><br>

        Mochi collected all 3 relics.
        <br><br>

        The curse shatters apart.
        <br><br>

        The mansion screams as sunlight floods the halls.
        <br><br>

        Mochi escapes into freedom carrying the haunted candle proudly in his mouth. 🐶
        <br><br>

        <button onclick="location.reload()">
        Play Again
        </button>

        `;

    }

    else{

        endingBox.innerHTML = `

        👑 BAD ENDING 👑
        <br><br>

        Mochi failed to gather every relic.
        <br><br>

        The ghosts crown him the new ruler forever.
        <br><br>

        He becomes:
        <br><br>

        <b>THE DREAD LORD OF BARKNESS</b>
        <br><br>

        honestly he seems very happy about it
        <br><br>

        <button onclick="location.reload()">
        Play Again
        </button>

        `;

    }

}

/* ================= SECRET ENDING ================= */

function secretEnding(){

    endingScreen.style.display = "flex";

    endingBox.innerHTML = `

    💥 SECRET ENDING 💥
    <br><br>

    The forbidden sequence is complete.
    <br><br>

    Reality begins buffering.
    <br><br>

    Mochi slowly turns toward YOU.
    <br><br>

    "wait... im trapped inside html?"
    <br><br>

    The universe collapses into corrupted png files and squeaky toy noises.
    <br><br>

    EVERYTHING EXPLODES.
    <br><br>

    <button onclick="location.reload()">
    Reboot Reality
    </button>

    `;

}

/* ================= START GAME ================= */

loadRoom();

</script>

</body>
</html>
